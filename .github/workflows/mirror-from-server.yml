name: Mirror serwer → repo (wyłączony)

# Automatyczny mirror został wyłączony. Agencja SEO pracuje bezpośrednio na FTP,
# a wdrożenie repo → serwer jest teraz wyłącznie ręczne. Dzięki temu zmiany
# wprowadzone na serwerze nie są nadpisywane po zwykłym pushu do repozytorium.
#
# Przed ponownym włączeniem mirrora należy zastosować zamkniętą listę publicznych
# plików. Nie wolno kopiować całego public_html do publicznego repozytorium.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Informacja
        run: echo "Mirror jest wyłączony. Zmiany agencji pozostają na serwerze; deploy uruchamiaj ręcznie."
