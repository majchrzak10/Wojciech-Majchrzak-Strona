# =============================================================================
# Mirror serwer → repo (odwrotność deploy.yml)
#
# Agencja SEO pracuje bezpośrednio na FTP i może zakładać dowolne podkatalogi.
# Ten workflow co 6h ściąga CAŁY public_html poza listą wykluczeń i commituje
# różnicę, żeby historia zmian nie ginęła, a ręczny deploy nie miał czego
# nadpisać. Repo staje się lustrem serwera, nie odwrotnie.
#
# BEZPIECZEŃSTWO: pliki na serwerze zawierają PRAWDZIWY klucz Google Maps
# (wstrzykiwany przy deployu). Repo jest publiczne, więc klucz jest zdejmowany
# do placeholdera __GOOGLE_MAPS_KEY__, a job pada, jeśli po sanityzacji
# w plikach zostaje cokolwiek wyglądającego na klucz Google API.
#
# ZASADA: albo pełny, udany transfer, albo zero commitów. Każdy błąd lftp
# przerywa joba — repo nigdy nie jest aktualizowane połowicznym poborem.
#
# Sekrety: te same co w deploy.yml (FTP_SERVER/USERNAME/PASSWORD, GOOGLE_MAPS_KEY)
# =============================================================================

name: Mirror serwer → repo (wmajchrzak.pl)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-wmajchrzak
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/domains/wmajchrzak.pl/public_html/' }}
      GMAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Sprawdź, czy sekret z kluczem Maps istnieje
        run: |
          if [ -z "$GMAPS_KEY" ]; then
            echo "::error::Brak sekretu GOOGLE_MAPS_KEY. Bez niego nie da się zdjąć klucza z pobranych plików — przerywam, żeby nie wypchnąć go do publicznego repo."
            exit 1
          fi

      - name: Instalacja lftp i rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp rsync

      # Pobieramy wszystko poza wykluczeniami — agencja może zakładać dowolne
      # podkatalogi i mają one trafiać do repo bez zmiany tego pliku.
      # Wykluczone: resztki starego WordPressa, rzeczy zarządzane przez serwer
      # (.well-known, cgi-bin, logi), stan FTP-Deploy-Action i archiwa/zrzuty,
      # których nie chcemy wpychać do gita.
      #
      # `ftp:list-options -a` jest konieczne — bez tego LIST na hostingu pomija
      # pliki z kropką i .htaccess nigdy by się nie pobrał (po cichu, bez błędu).
      - name: Pobierz stan serwera
        run: |
          mkdir -p server-state
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:list-options -a
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd "$SERVER_DIR"
          mirror --no-perms --no-symlinks \
            -X 'wp-admin/' -X 'wp-content/' -X 'wp-includes/' -X 'wp-*.php' \
            -X '.well-known/' -X 'cgi-bin/' \
            -X '.ftp-deploy-sync-state.json' \
            -X '.htpasswd' -X '.user.ini' -X 'php.ini' \
            -X 'error_log' -X '*.log' \
            -X '.DS_Store' -X 'Thumbs.db' \
            -X '*.zip' -X '*.tar' -X '*.gz' -X '*.sql' -X '*.bak' \
            . server-state
          bye
          LFTP
          echo "Pobrano $(find server-state -type f | wc -l) plików, łącznie $(du -sh server-state | cut -f1):"
          find server-state -type f | sort

      - name: Kontrola sensowności pobranych plików
        run: |
          F=server-state/index.html
          if [ ! -f "$F" ]; then
            echo "::error::Nie pobrano index.html z serwera — to scenariusz awarii z 2026-07-20. Nie nadpisuję repo."
            exit 1
          fi
          SIZE=$(stat -c%s "$F")
          if [ "$SIZE" -lt 50000 ]; then
            echo "::error::index.html ma tylko ${SIZE} B (norma ~97 kB). Serwer prawdopodobnie w awarii — nie nadpisuję repo."
            exit 1
          fi
          if grep -q 'wp-content' "$F"; then
            echo "::error::Pobrany index.html zawiera WordPressa — DirectoryIndex spadł na index.php. Nie commituję."
            exit 1
          fi

          # Pusty plik = urwany transfer, nie edycja agencji.
          EMPTY=$(find server-state -type f -empty)
          if [ -n "$EMPTY" ]; then
            echo "::error::Puste pliki po transferze:"; echo "$EMPTY"
            exit 1
          fi

          # Nie wpychamy do gita wielkich plików (np. zrzutu backupu wrzuconego
          # przez kogoś na serwer). Loud fail — dopisz wzorzec do -X i odpal ponownie.
          BIG=$(find server-state -type f -size +25M)
          if [ -n "$BIG" ]; then
            echo "::error::Pliki >25 MB — dopisz je do wykluczeń w tym workflow:"; echo "$BIG"
            exit 1
          fi

      - name: Zdejmij klucz Google Maps
        run: |
          # Literalna podmiana (perl \Q..\E), żeby znaki specjalne w kluczu
          # nie były interpretowane jako regex.
          #
          # Bez pipeline'u celowo: brak trafień to exit 1 z grepa, co pod
          # `-o pipefail` wywaliłoby krok przed strażnikami niżej — a to jest
          # dokładnie sytuacja „sekret zrotowany, na serwerze stary klucz",
          # którą chcemy zaraportować czytelnie, nie zgasić.
          KEYFILES=$(mktemp)
          grep -rlFZ "$GMAPS_KEY" server-state > "$KEYFILES" || true
          while IFS= read -r -d '' f; do
            echo "Sanityzacja: $f"
            perl -pi -e 's/\Q$ENV{GMAPS_KEY}\E/__GOOGLE_MAPS_KEY__/g' "$f"
          done < "$KEYFILES"
          rm -f "$KEYFILES"

          if grep -rqF "$GMAPS_KEY" server-state; then
            echo "::error::Klucz z sekretu nadal obecny po sanityzacji — przerywam."
            exit 1
          fi

          # Siatka bezpieczeństwa na klucz INNY niż ten z sekretu (rotacja klucza,
          # albo agencja wkleiła własny). Bez tego wyciekłby do publicznego repo.
          if grep -rqE 'AIza[0-9A-Za-z_-]{35}' server-state; then
            echo "::error::W plikach jest klucz Google API niepasujący do sekretu GOOGLE_MAPS_KEY:"
            grep -rlE 'AIza[0-9A-Za-z_-]{35}' server-state
            echo "::error::Sprawdź, czy klucz nie został zrotowany albo wklejony ręcznie. Nie commituję."
            exit 1
          fi

          if ! grep -q '__GOOGLE_MAPS_KEY__' server-state/index.html; then
            echo "::error::W index.html nie ma placeholdera __GOOGLE_MAPS_KEY__ — deploy nie miałby czego podmienić i mapa oraz live opinie by padły. Nie commituję."
            exit 1
          fi

      # Wykluczenia w pliku, bo używają ich dwa kroki (podgląd i właściwy zapis)
      # i rozjechanie się list byłoby cichym błędem.
      #
      # UWAGA NA PRZYSZŁOŚĆ: repo jest lustrem serwera. Cokolwiek dodasz do repo,
      # a czego nie ma na FTP (np. .gitignore, skrypty, konfigi), zniknie przy
      # najbliższym mirrorze — chyba że dopiszesz to tutaj.
      - name: Przygotuj listę wykluczeń
        run: |
          cat > /tmp/rsync-excludes <<'EOF'
          .git/
          .github/
          *.md
          EOF

      # rsync --delete ma pełny zasięg drzewa repo, więc niekompletny listing z FTP
      # (zrywane PASV na shared hostingu) mógłby zostać odczytany jako „agencja
      # skasowała pół strony" i zacommitowany bez niczyjej wiedzy. Kasowanie
      # powyżej progu wymaga więc ręcznej decyzji.
      - name: Sprawdź skalę kasowania przed nadpisaniem repo
        run: |
          PLAN=$(rsync -ai --delete --dry-run --exclude-from=/tmp/rsync-excludes server-state/ ./)
          DEL=$(printf '%s\n' "$PLAN" | grep -c '^\*deleting' || true)
          TOTAL=$(git ls-files | wc -l)
          LIMIT=$(( TOTAL / 4 ))
          if [ "$LIMIT" -lt 5 ]; then LIMIT=5; fi

          if [ "$DEL" -gt 0 ]; then
            echo "Pliki do usunięcia z repo (${DEL} z ${TOTAL} śledzonych, próg ${LIMIT}):"
            printf '%s\n' "$PLAN" | grep '^\*deleting' || true
          fi

          if [ "$DEL" -gt "$LIMIT" ]; then
            echo "::error::Mirror chce skasować ${DEL} z ${TOTAL} plików — to wygląda na niekompletny transfer, nie na edycję agencji. Przerywam. Jeśli kasacja jest prawdziwa, odpal workflow ponownie po sprawdzeniu serwera albo podnieś próg."
            exit 1
          fi

      - name: Wgraj stan serwera do repo i commituj
        run: |
          rsync -a --delete --exclude-from=/tmp/rsync-excludes server-state/ ./
          rm -rf server-state

          # Post-condition: --delete bez --delete-excluded nie rusza wykluczeń,
          # ale to zbyt kosztowne założenie, żeby brać je na wiarę.
          if [ ! -f .github/workflows/mirror-from-server.yml ] || [ ! -d .git ]; then
            echo "::error::rsync zjadł .github albo .git — przerywam przed commitem."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Brak zmian na serwerze."
            exit 0
          fi
          echo "Zmiany do zacommitowania:"; git diff --cached --stat
          git commit -m "Mirror: zmiany wprowadzone bezpośrednio na serwerze (FTP)"
          git pull --rebase
          git push
